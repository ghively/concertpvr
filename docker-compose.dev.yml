services:
  concertpvr:
    build: .
    image: concertpvr:latest
    container_name: concertpvr-dev
    ports:
      - "8787:8787"
    volumes:
      - ./.local-data:/data
      - ./.local-publish:/media/concerts
    environment:
      CPVR_DATA_DIR: /data
      CPVR_PUBLISH_DIR: /media/concerts
      CPVR_STATIC_DIR: /app/static
      CPVR_HOST: 0.0.0.0
    restart: "no"
